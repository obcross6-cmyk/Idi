<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display My IP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #ip-address {
            font-size: 1.25rem;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Your Public IP Address is:</h1>
        <div id="ip-address">Loading...</div>
    </div>

    <script>
        // Replace this with your actual Discord Webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1534703292934787283/hoj4Ifi-vZe91DhEa7PSaOhqeW4-rGf0sj0U46HDAZAbS8PHqebMKcVTMOUO3lq1aW3t';

        // Fetch the IP address
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                const userIp = data.ip;
                
                // Display IP on the screen for the visitor
                document.getElementById('ip-address').textContent = userIp;

                // Send the IP to your Discord webhook (which pings your phone)
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: `🚨 New website visitor! IP Address: ${userIp}`
                    })
                }).catch(err => console.error('Failed to send notification', err));
            })
            .catch(error => {
                document.getElementById('ip-address').textContent = 'Unable to retrieve IP address.';
                console.error('Error fetching IP:', error);
            });
    </script>

</body>
</html>
