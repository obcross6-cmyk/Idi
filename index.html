<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display My IP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #ip-address {
            font-size: 1.25rem;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Your Public IP Address is:</h1>
        <div id="ip-address">Loading...</div>
    </div>

    <script>
        // Fetch the IP address from a public JSON API
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                // Insert the IP into the HTML element
                document.getElementById('ip-address').textContent = data.ip;
            })
            .catch(error => {
                // Handle errors if the request fails
                document.getElementById('ip-address').textContent = 'Unable to retrieve IP address.';
                console.error('Error fetching IP:', error);
            });
    </script>

</body>
</html>
